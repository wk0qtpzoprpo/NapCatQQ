# 构建 NapCat × B2 镜像并推送到 GitHub Container Registry (ghcr.io)
#
# 触发：
#   - push 到 napcat-b2/** 或本工作流文件
#   - 手动触发（仓库 Actions 需先启用）
#
# 产物：ghcr.io/<owner>/napcat-b2:latest  +  ghcr.io/<owner>/napcat-b2:<commit-sha>
name: build-napcat-b2

on:
  push:
    paths:
      - 'napcat-b2/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./napcat-b2
          file: ./napcat-b2/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/napcat-b2:latest
            ghcr.io/${{ github.repository_owner }}/napcat-b2:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
